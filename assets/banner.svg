<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #a78bfa;
    }
    
    /* Background Dynamic Elements */
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.08); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .bg-node {
      animation: pulse 4s infinite ease-in-out;
      transform-origin: center;
    }
    .bg-float-1 { animation: float 6s infinite ease-in-out; }
    .bg-float-2 { animation: float 8s infinite ease-in-out 1s; }
    .connecting-line {
      stroke-dasharray: 8 4;
      animation: dash 2s linear infinite;
    }
  </style>

  <!-- Base Layer -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="350" fill="url(#grid)" rx="16"/>

  <!-- Background Dynamic Network/Flow Graphics (Low opacity behind text) -->
  <g opacity="0.25">
    <!-- Glowing background Orbs -->
    <circle cx="150" cy="100" r="80" fill="#8b5cf6" class="bg-node" filter="url(#glow)"/>
    <circle cx="1050" cy="250" r="100" fill="#3b82f6" class="bg-node" filter="url(#glow)"/>

    <!-- Animated Data Flow Lines -->
    <path d="M 100 280 Q 300 150 600 250 T 1100 120" fill="none" stroke="#6366f1" stroke-width="2" class="connecting-line"/>
    <path d="M 50 120 Q 400 300 800 100 T 1150 220" fill="none" stroke="#ec4899" stroke-width="1.5" class="connecting-line"/>

    <!-- Floating Graphic Nodes -->
    <g class="bg-float-1">
      <rect x="920" y="50" width="180" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="940" y="80" fill="#94a3b8" font-family="sans-serif" font-size="12">Entity: Schema.org</text>
      <text x="940" y="100" fill="#38bdf8" font-family="sans-serif" font-size="12">3,840+ Classes</text>
    </g>

    <g class="bg-float-2">
      <rect x="840" y="200" width="200" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="860" y="230" fill="#94a3b8" font-family="sans-serif" font-size="12">Ontology: FIBO / FHIR</text>
      <text x="860" y="255" fill="#a855f7" font-family="sans-serif" font-size="12">Semantic Alignment</text>
    </g>
  </g>

  <!-- Foreground Content Container (Guaranteed Clear & Visible) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill / Category Tag -->
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="16" y="21" class="badge-text">🌐 CURATED DATA STANDARDS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title">Awesome Standard Data Model 📊</text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle">Unified Schemas, Industry Ontologies, Common Data Models &amp; Interoperability Specs</text>

    <!-- Tech Specs / Tags Row -->
    <g transform="translate(0, 235)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="23" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="500">🏦 Financial</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="130" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="157" y="23" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="500">🏥 Healthcare</text>

      <!-- Tag 3 -->
      <rect x="284" y="0" width="120" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="299" y="23" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="500">📡 Telecom</text>

      <!-- Tag 4 -->
      <rect x="416" y="0" width="140" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="431" y="23" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="500">🌐 Web &amp; IoT</text>
    </g>
  </g>

  <!-- Accent Border Bottom -->
  <rect x="0" y="344" width="1200" height="6" fill="url(#bgGrad)" rx="3"/>
</svg>
